<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PipClash Ops – Admin</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/site.css?v=ops1">
<link rel="stylesheet" href="assets/ops.css?v=ops4">
</head>
<body class="ops-body">
<div class="ops" data-admin>
  <!-- login / 2FA / denied (admin.js) -->
  <div class="ops-gate card" data-a-view="login" hidden><h1>PipClash Ops</h1><p class="muted2">Please log in first.</p><a class="btn btn-lg" href="account.html#login">Log in</a></div>
  <div class="ops-gate card" data-a-view="mfa" hidden><h1>2-step security</h1>
    <p class="muted2" data-mfa-help>Admin panel needs a 6-digit code from Google Authenticator.</p>
    <div data-mfa-qr style="background:#fff;border-radius:12px;padding:10px;max-width:220px" hidden></div>
    <p class="muted2 a-sm" data-mfa-secret hidden></p>
    <label for="mfa-code">6-digit code</label>
    <input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
    <button class="btn btn-lg" type="button" data-mfa-go>Verify</button>
    <p class="acc-msg" data-mfa-msg role="status"></p></div>
  <div class="ops-gate card" data-a-view="denied" hidden><h1>Not allowed</h1><p class="muted2">This page is only for the PipClash team.</p></div>

  <div class="ops-app" data-a-view="main" hidden>
    <aside class="ops-side">
      <a class="ops-brand" href="ops.html"><img src="assets/icon-192.png" alt="" width="34" height="34"><span><b>PipClash</b><small>Ops · Back office</small></span></a>
      <nav class="ops-nav" aria-label="Admin">
        <div class="ops-grp">Roz ka kaam</div>
        <button type="button" data-a-tab="today"><i>⚡</i>Aaj (battle day)</button>
        <button type="button" data-a-tab="money"><i>$</i>Payments &amp; KYC</button>
        <button type="button" data-a-tab="battle"><i>⚔</i>Battles</button>
        <button type="button" data-a-tab="players"><i>👤</i>Players</button>
        <button type="button" data-a-tab="support"><i>✉</i>Support</button>
        <button type="button" data-a-tab="risk"><i>⚠</i>Risk &amp; fraud</button>
        <button type="button" data-a-tab="daily"><i>Σ</i>Daily hisaab</button>
        <button type="button" data-a-tab="influencers"><i>★</i>Influencers</button>
        <details class="ops-more"><summary class="ops-grp">More ▾</summary>
        <button type="button" data-a-tab="dash"><i>▦</i>Dashboard</button>
        <button type="button" data-a-tab="command"><i>✦</i>Command center</button>
        <button type="button" data-a-tab="bookings"><i>🎟</i>Bookings</button>
        <button type="button" data-a-tab="campaigns"><i>↗</i>Campaigns</button>
        <button type="button" data-a-tab="creatives"><i>▣</i>Creatives</button>
        <button type="button" data-a-tab="competitions"><i>🏆</i>Competitions</button>
        <button type="button" data-a-tab="broadcast"><i>📣</i>Broadcast</button>
        <button type="button" data-a-tab="reports"><i>▤</i>Reports</button>
        <button type="button" data-a-tab="settings"><i>⚙</i>Settings</button>
        <button type="button" data-a-tab="team"><i>☺</i>Team</button>
        <button type="button" data-a-tab="log"><i>≡</i>Activity log</button>
        </details>
      </nav>
      <div class="ops-me" data-a-me></div>
    </aside>
    <main class="ops-main">
      <header class="ops-top">
        <div><h1 data-ops-title>Dashboard</h1><p class="muted2" data-a-mode></p></div>
        <div class="ops-tools">
          <div class="ops-range" role="group" aria-label="Date range" data-ops-range>
            <button type="button" data-r="1">Today</button><button type="button" data-r="7">7 days</button>
            <button type="button" data-r="30" aria-pressed="true">30 days</button><button type="button" data-r="0">All</button>
          </div>
          <button class="btn btn-ghost btn-sm" type="button" data-a-refresh>Refresh</button>
        </div>
      </header>
      <div data-a-pane class="ops-pane"></div>
    </main>
  </div>
  <div class="a-toast" data-a-toast hidden></div>
</div>
<script src="assets/vendor/supabase.js"></script>
<script>
(function () {   // ?demo=1 (sirf laptop) = admin.js (login) nahi, sirf design; warna admin.js phir ops.js
  var demo = /[?&]demo=1/.test(location.search) && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  function add(src, cb) { var s = document.createElement('script'); s.src = src; if (cb) s.onload = cb; document.body.appendChild(s); }
  if (demo) add('assets/ops.js?v=ops8'); else add('assets/admin.js?v=ops4', function () { add('assets/ops.js?v=ops8'); });
})();
</script>
</body>
</html>
